name: Build & Package

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      # Windows 控制台默认 cp1252，强制 UTF-8 避免中文输出 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (locked)
        run: uv sync --frozen --no-dev

      - name: Install Nuitka
        run: uv pip install nuitka ordered-set zstandard

      - name: Install patchelf (Linux standalone)
        if: runner.os == 'Linux'
        run: uv pip install patchelf

      - name: Build + package (Nuitka, auto platform)
        run: uv run python scripts/build_nuitka.py

      - name: List artifacts
        shell: bash
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}
          path: dist/dsh-desktop-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          generate_release_notes: true
