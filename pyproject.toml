[project]
name = "dsh-desktop"
version = "0.1.0"
description = "PySide6 desktop client for DeepSeek Harness: manages the dsh web server and embeds its full web GUI"
readme = "README.md"
authors = [
    { name = "ruby", email = "hack@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "httpx>=0.27",
    "websocket-client>=1.8",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8",
]

[project.scripts]
dsh-desktop = "dsh_desktop.__main__:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
